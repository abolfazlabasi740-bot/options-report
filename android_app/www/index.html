<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptimusAI - داشبورد تحلیلی بازار</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151e2e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --border-color: #1e293b;
            --accent-blue: #38bdf8;
        }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            direction: rtl;
        }
        header {
            background: var(--card-bg);
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent-blue);
            margin-bottom: 4px;
        }
        .meta-info {
            font-size: 11px;
            color: var(--text-muted);
        }
        .badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            min-width: 650px;
        }
        th, td {
            padding: 10px 12px;
            font-size: 12.5px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }
        th {
            background: #0d1524;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 11.5px;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }
        .pos { color: var(--accent-green); font-weight: 700; direction: ltr; text-align: left; }
        .neg { color: var(--accent-red); font-weight: 700; direction: ltr; text-align: left; }
        .symbol-tag {
            font-weight: 800;
            color: #fff;
            font-size: 13px;
        }
        .price-num { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>
    <header>
        <div>
            <div class="header-title">⚡ دیده‌بان نقدشوندگی و سهام برتر (OptimusAI)</div>
            <div id="retrieved-at" class="meta-info">در حال همگام‌سازی زمان و داده...</div>
        </div>
        <div>
            <span class="badge" id="source-badge">آفلاین / کش</span>
        </div>
    </header>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ردیف</th>
                    <th>نماد</th>
                    <th>نام کامل / صنعت</th>
                    <th>قیمت پایانی</th>
                    <th>آخرین قیمت</th>
                    <th>پایانی دیروز</th>
                    <th style="text-align: left;">درصد تغییر پایانی</th>
                    <th>حجم معاملات</th>
                    <th>تعداد معاملات</th>
                </tr>
            </thead>
            <tbody id="data-body">
                <tr><td colspan="9" style="text-align: center; padding: 24px; color: var(--text-muted);">در حال خواندن داده‌های بازار...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        function fmt(n) {
            if (n === null || n === undefined || isNaN(n)) return "-";
            return Number(n).toLocaleString('en-US');
        }

        function fmtPct(n) {
            if (n === null || n === undefined || isNaN(n)) return "-";
            let val = Number(n);
            let sign = val > 0 ? "+" : "";
            return sign + val.toFixed(2) + "%";
        }

        async function loadBundle() {
            try {
                let res = await fetch('./market_analytics_bundle.json?v=' + Date.now());
                if (!res.ok) throw new Error("پاسخ سرور نامعتبر بود: " + res.status);
                let bundle = await res.json();

                // استخراج تاریخ و هدر شمسی
                let headerText = "برچسب داده:";
                if (typeof bundle.header === 'string') {
                    headerText = bundle.header;
                } else if (bundle.retrieved_at) {
                    headerText = "زمان سند: " + bundle.retrieved_at;
                }
                document.getElementById('retrieved-at').innerText = headerText;

                // استخراج لیست سهم‌ها (پوشش تمام فرمت‌ها)
                let list = bundle.top_gainers || bundle.symbols || [];
                let tbody = document.getElementById('data-body');
                tbody.innerHTML = "";

                if (!list || list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 20px;">هیچ رکوردی یافت نشد.</td></tr>';
                    return;
                }

                list.forEach((item, idx) => {
                    let tr = document.createElement('tr');
                    
                    // استخراج فیلدها با انعطاف بالا نسبت به نام فیلدهای داخل گیت
                    let namad = item.namad || item.symbol || item.l18 || "-";
                    let name = item.name || item.title || item.l30 || "-";
                    let closePrice = item.close_price ?? item.pc ?? item.final_price;
                    let lastPrice = item.last_price ?? item.pl ?? item.latest_price;
                    let prevClose = item.prev_close ?? item.py ?? item.yesterday_price;
                    
                    // محاسبه یا خواندن درصد تغییر با مبنای دقیق قیمت پایانی
                    let changePct = item.change_pct ?? item.pc_change_pct;
                    if ((changePct === null || changePct === undefined) && closePrice && prevClose && prevClose > 0) {
                        changePct = ((closePrice - prevClose) / prevClose) * 100;
                    }

                    let vol = item.volume ?? item.tvol ?? 0;
                    let trades = item.trades_count ?? item.tno ?? "-";

                    let pctVal = Number(changePct);
                    let pctClass = pctVal >= 0 ? 'pos' : 'neg';

                    tr.innerHTML = `
                        <td style="color: var(--text-muted); font-size: 11px;">${idx + 1}</td>
                        <td><span class="symbol-tag">${namad}</span></td>
                        <td style="color: var(--text-muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis;">${name}</td>
                        <td class="price-num"><b>${fmt(closePrice)}</b></td>
                        <td class="price-num" style="color: var(--text-muted);">${fmt(lastPrice)}</td>
                        <td class="price-num" style="color: var(--text-muted);">${fmt(prevClose)}</td>
                        <td class="${pctClass}">${fmtPct(changePct)}</td>
                        <td class="price-num">${fmt(vol)}</td>
                        <td class="price-num" style="color: var(--text-muted);">${fmt(trades)}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                console.error(err);
                document.getElementById('data-body').innerHTML = `
                    <tr><td colspan="9" style="text-align: center; color: var(--accent-red); padding: 20px;">
                        خطا در واکشی داده‌ها: ${err.message}
                    </td></tr>
                `;
            }
        }

        loadBundle();
        setInterval(loadBundle, 15000);
    </script>
</body>
</html>
