name: Offline TSETMC tests

on:
  pull_request:
    branches: [main]
    paths:
      - "data/tsetmc.py"
      - "data/underlying_map.py"
      - "test_tsetmc.py"
      - ".github/workflows/test-tsetmc.yml"
  workflow_dispatch:

jobs:
  test-tsetmc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile TSETMC modules
        run: python -m py_compile data/tsetmc.py data/underlying_map.py
      - name: Run offline TSETMC tests
        run: python test_tsetmc.py
