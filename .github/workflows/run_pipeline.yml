name: Run Options Report Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * 0,1,2,3,4'

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl requests

      - name: Run Script
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          FILE=$(ls -t *.xlsx | head -n 1)
          echo "Processing file: $FILE"
          python generate_report.py "$FILE"
