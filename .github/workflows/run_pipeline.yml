name: Optionschool V3 Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Find Latest Excel
        id: select_file
        shell: bash
        run: |
          latest_file="$(find . -maxdepth 2 -type f -name 'optionschool24_all_*.xlsx' | sort -V | tail -n 1)"
          if [ -z "$latest_file" ]; then
            echo 'Error: No Excel file found!'
            exit 1
          fi
          echo "file=$latest_file" >> "$GITHUB_OUTPUT"
          echo "Selected File: $latest_file"

      - name: Run Report & Send to Bale
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          SEND_TO_BALE: 'true'
        run: |
          python generate_report.py "${{ steps.select_file.outputs.file }}"
