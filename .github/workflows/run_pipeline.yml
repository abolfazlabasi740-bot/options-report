name: Optionschool V3 Scheduled Pipeline

on:
  schedule:
    # اجرای Canonical فقط یک‌بار در روز معاملاتی، رأس ۹:۱۵ به وقت تهران
    - cron: '15 9 * * 0,1,2,3,6'
      timezone: "Asia/Tehran"
  workflow_dispatch:

concurrency:
  group: optionschool-v3-report
  cancel-in-progress: false

jobs:
  download-audit-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Generate Canonical V3 Report and Send to Bale
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          SEND_TO_BALE: 'true'
        run: |
          python generate_report.py
