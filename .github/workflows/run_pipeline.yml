name: Daily Options Pipeline

on:
  schedule:
    # اجرا در ساعات معاملاتی بورس تهران (شنبه تا چهارشنبه از 8:45 تا 12:45 به وقت ایران = 5:15 تا 9:15 UTC)
    - cron: '15,45 5-9 * * 0,1,2,3,6'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl tabulate

      - name: Run Pipeline
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          python generate_report.py
