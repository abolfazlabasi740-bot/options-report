name: Optionschool V3 Scheduled Pipeline

on:
  schedule:
    # ساعت های گرینویچ معادل 09:15 تا 12:15 ایران (شنبه تا چهارشنبه)
    - cron: '45 5 * * 0,1,2,3,6'
    - cron: '15 6 * * 0,1,2,3,6'
    - cron: '45 6 * * 0,1,2,3,6'
    - cron: '15 7 * * 0,1,2,3,6'
    - cron: '45 7 * * 0,1,2,3,6'
    - cron: '15 8 * * 0,1,2,3,6'
    - cron: '45 8 * * 0,1,2,3,6'
  workflow_dispatch:

jobs:
  download-audit-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Download Live Excel & Audit & Send to Bale
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          SEND_TO_BALE: 'true'
        run: |
          python generate_report.py
