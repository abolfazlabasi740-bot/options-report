name: Optionschool night snapshot

on:
  schedule:
    - cron: "31 12 * * 6,0,1,2,3"
      timezone: "Asia/Tehran"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_ROOT: smart_money_project
    steps:
      - uses: actions/checkout@v4
      - name: Download closing snapshot
        shell: bash
        run: |
          mkdir -p "${PROJECT_ROOT}/data/raw"
          file="${PROJECT_ROOT}/data/raw/optionschool24_all_$(date +%s).xlsx"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
            --max-time 120 "https://s3.optionschool24.com/export/excel?type=1" --output "$file"
          test -s "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$file"
          git diff --cached --quiet || git commit -m "data: persist closing Optionschool snapshot [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
