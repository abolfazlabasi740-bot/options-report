name: live-schema-audit

on:
  workflow_dispatch:

jobs:
  audit-live-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit live OptionSchool24 schema
        run: python live_schema_audit.py --output output/live_schema_audit.json
      - name: Upload schema metadata
        uses: actions/upload-artifact@v4
        with:
          name: live-schema-audit
          path: output/live_schema_audit.json
          if-no-files-found: error
