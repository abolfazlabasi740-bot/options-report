name: live-schema-audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit-live-tsetmc-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Capture live TSETMC Option Market-Watch evidence
        run: |
          set +e
          python tsetmc_live_smoke.py --option-market-watch --flow 1 --allow-network-unavailable --timeout 8 --retries 0
          rc=$?
          set -e
          test -s output/g7_tsetmc/option_market_watch.json
          test -s output/g7_tsetmc/option_market_watch.raw.json
          if [ "$rc" -ne 0 ]; then
            python - <<'PY'
            import json
            from pathlib import Path
            x=json.loads(Path("output/g7_tsetmc/option_market_watch.json").read_text(encoding="utf-8"))
            if x.get("status") != "NETWORK_UNAVAILABLE":
                raise SystemExit("TSETMC smoke failed with unexpected status")
            print("SMOKE_EXIT_ALLOWED=NETWORK_UNAVAILABLE")
            PY
          fi

      - name: Validate TSETMC identity boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("output/g7_tsetmc/option_market_watch.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          print("STATUS =", x.get("status"))
          print("SOURCE =", x.get("source"))
          print("ENDPOINT =", x.get("endpoint"))
          print("RETRIEVED_AT =", x.get("retrieved_at"))
          print("SNAPSHOT_SHA256 =", x.get("snapshot_sha256"))
          print("EXPLICIT_INS_CODE_COUNT =", x.get("explicit_ins_code_count"))
          print("DATA_PRESENT =", x.get("data_present"))
          if x.get("source") != "TSETMC":
              raise SystemExit("TSETMC source boundary failed")
          if x.get("status") == "NETWORK_UNAVAILABLE":
              print("LIVE_SOURCE_STATUS=OPEN_NETWORK_UNAVAILABLE")
              print("No live evidence is claimed by this CI run.")
          elif x.get("status") == "SUCCESS":
              if not x.get("data_present") or int(x.get("explicit_ins_code_count", 0)) <= 0:
                  raise SystemExit("TSETMC live source returned no explicit option IDs")
          else:
              raise SystemExit("Unexpected TSETMC smoke status")
          PY

      - name: Run repository TSETMC-first unit tests
        run: python -m unittest tests.test_tsetmc_first_source -v

      - name: Publish TSETMC evidence
        uses: actions/upload-artifact@v4
        with:
          name: tsetmc-live-source-evidence
          path: |
            output/g7_tsetmc/option_market_watch.json
            output/g7_tsetmc/option_market_watch.raw.json
          if-no-files-found: error
