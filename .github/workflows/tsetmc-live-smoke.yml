name: tsetmc-live-smoke

on:
  workflow_dispatch:

jobs:
  tsetmc-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run TSETMC market overview smoke test
        run: python tsetmc_live_smoke.py --output output/tsetmc_live_smoke.json
      - name: Upload source evidence
        uses: actions/upload-artifact@v4
        with:
          name: tsetmc-live-smoke
          path: output/tsetmc_live_smoke.json
          if-no-files-found: error